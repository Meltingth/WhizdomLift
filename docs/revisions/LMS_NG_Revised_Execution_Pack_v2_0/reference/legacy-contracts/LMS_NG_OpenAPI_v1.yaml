          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        temporaryPassword:
          type: string
        roleAssignments:
          type: array
          items:
            type: object
            additionalProperties: true
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventTime:
          type: string
          format: date-time
        actorType:
          type: string
        actorName:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        result:
          type: string
        correlationId:
          type: string
          format: uuid
    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          format: uri
        eventTypes:
          type: array
          items:
            type: string
        enabled:
          type: boolean
