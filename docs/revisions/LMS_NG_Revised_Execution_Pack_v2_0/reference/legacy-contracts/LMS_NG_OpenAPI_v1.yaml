        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElevatorUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Elevator'
        '400': *id003
        '401': *id004
        '403': *id005
        '404': *id006
        '409': *id007
      security:
      - bearerAuth: []
