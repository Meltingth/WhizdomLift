          type: string
          enum:
          - P1
          - P2
          - P3
          - P4
        assigneeUserId:
          type: string
          format: uuid
    TicketUpdate:
      type: object
      properties:
        status:
          type: string
        priority:
          type: string
        assigneeUserId:
          type: string
          format: uuid
        rootCause:
          type: string
        resolution:
          type: string
        downtimeStart:
          type: string
          format: date-time
        downtimeEnd:
          type: string
          format: date-time
    TicketComment:
