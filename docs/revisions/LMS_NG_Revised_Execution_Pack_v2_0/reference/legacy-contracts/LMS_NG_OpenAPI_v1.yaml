          format: uuid
        title:
          type: string
        status:
          type: string
        priority:
          type: string
        assigneeUserId:
          type:
          - string
          - 'null'
          format: uuid
        openedAt:
          type: string
          format: date-time
        slaDueAt:
          type:
          - string
          - 'null'
          format: date-time
        rootCause:
          type:
          - string
          - 'null'
        resolution:
          type:
          - string
          - 'null'
