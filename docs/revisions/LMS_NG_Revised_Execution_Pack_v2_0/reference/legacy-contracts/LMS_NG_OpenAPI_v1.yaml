      type: object
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        assetCode:
          type: string
        name:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        enabled:
          type: boolean
        tags:
          type: array
          items:
            type: string
        etag:
          type: string
    ElevatorCreate:
      type: object
      required:
      - groupId
      - assetCode
      - name
      properties:
        groupId:
          type: string
          format: uuid
        assetCode:
          type: string
        name:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        tags:
          type: array
          items:
            type: string
    ElevatorUpdate:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        tags:
          type: array
          items:
            type: string
        serviceStatus:
          type: string
    ElevatorStatus:
      type: object
      required:
      - elevatorId
      - eventTime
      - connectionState
      - direction
      properties:
        elevatorId:
          type: string
          format: uuid
        eventTime:
          type: string
          format: date-time
        receiveTime:
          type: string
          format: date-time
        connectionState:
          type: string
          enum:
          - HEALTHY
          - NETWORK_OFFLINE
          - GATEWAY_OFFLINE
          - INTERFACE_NO_RXTX
          - STALE
          - UNKNOWN
        floorRaw:
          type:
          - string
          - 'null'
        floorDisplay:
          type:
          - string
          - 'null'
        direction:
          type: string
          enum:
          - UP
          - DOWN
          - IDLE
          - UNKNOWN
        operatingMode:
          type:
          - string
          - 'null'
        activeAlarmCount:
          type: integer
        statusPoints:
          type: object
          additionalProperties: true
        dataQuality:
          type: object
          additionalProperties: true
    TelemetryPoint:
      type: object
      properties:
        eventTime:
          type: string
          format: date-time
        metricCode:
          type: string
        value: {}
        unit:
          type: string
        quality:
          type: string
    Gateway:
      type: object
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        mode:
          type: string
        agentVersion:
          type: string
        adapterVersion:
          type: string
