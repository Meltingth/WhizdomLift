openapi: 3.1.0
info:
  title: LMS-NG API
  version: 2.0.0-draft.2
  description: >
    REST + WebSocket API for the Lift Monitoring System, candidate 2.0.0-draft.2. Base path
    is /api/v2 (owner decision, superseding draft.1's "/api/v1 kept unchanged" choice): a
    legacy v1 OpenAPI baseline already exists, this candidate changes multiple field
    semantics that are breaking regardless of base path (see CONTRACT_BASELINE_DIFF.md), and
    PRE-0/A-DRAFT's search for a deployed v1 consumer was scoped to the inspected
    repositories, this machine's local filesystem, and the supplied revision-pack artifacts
    only -- it did not reach the Dell/server environment or the deliberately-excluded
    LMS-NG Live Dashboard.html, so "no consumer found" was never strong enough grounds to
    justify reusing a legacy base path. /api/v2 costs nothing today and removes that risk
    entirely -- see docs/preflight/CONTRACT_BASELINE_DIFF.md section 5 for the full record of
    both decisions. Timestamps are RFC 3339 UTC; clients convert to Asia/Bangkok for display.
    Errors use RFC 7807 Problem Details, extended with a machine-checkable `code` enum (see
    components.schemas.Problem). Status DRAFT -- not approved.
servers:
  - url: https://lms.example.local
    description: Site server (placeholder; real host set per deployment, never committed)
tags:
  - name: Elevators
  - name: Gateways
  - name: Alarms
  - name: Events
  - name: Commands
  - name: Analytics
  - name: Demo
  - name: Realtime
  - name: Auth
  - name: System

paths:
  /api/v2/health:
    get:
      tags: [System]
      operationId: health
      summary: Service health
      security: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/v2/elevators:
    get:
      tags: [Elevators]
      operationId: listElevators
      summary: List/filter elevators for a site
      parameters:
        - name: siteId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: embed
          in: query
          schema: { type: string, enum: [status] }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [items, kpi]
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - { $ref: '#/components/schemas/Elevator' }
                        - { $ref: '#/components/schemas/ElevatorStatus' }
                  kpi:
                    type: object
                    required: [online, commissioned]
                    properties:
                      online: { type: integer, minimum: 0 }
                      commissioned:
                        type: integer
                        minimum: 0
                        description: >
                          Denominator excludes NOT_COMMISSIONED lifts (e.g. W-04 today is
                          OUT_OF_SERVICE but still COMMISSIONED per revision R12 -- it is
                          NOT excluded the way the v1-era plan's simpler enabled=false model
                          would have implied; see CONTRACT_BASELINE_DIFF.md section 5,U05).
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v2/elevators/{id}:
    get:
      tags: [Elevators]
      operationId: getElevator
      parameters:
        - { $ref: '#/components/parameters/ElevatorIdPath' }
        - name: embed
          in: query
          schema: { type: string, enum: [status] }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElevatorStatus' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v2/elevators/{id}/events:
    get:
      tags: [Events]
      operationId: getElevatorEvents
      x-status: planned
      description: Planned for P3-HISTORY. Not implemented or schema-tested against a live
        server in this A-DRAFT round.
      parameters:
        - { $ref: '#/components/parameters/ElevatorIdPath' }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ElevatorEvent' }

  /api/v2/gateways:
    get:
      tags: [Gateways]
      operationId: listGateways
      parameters:
        - name: siteId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GatewayStatus' }

  /api/v2/alarms:
    get:
      tags: [Alarms]
      operationId: listAlarms
      x-status: planned
      description: Planned for P4-ALARMS-DEMO.
      parameters:
        - name: siteId
          in: query
          schema: { type: string, format: uuid }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/AlarmSeverity' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/AlarmState' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Alarm' } }

  /api/v2/alarms/{id}/ack:
    post:
      tags: [Alarms]
      operationId: ackAlarm
      x-status: planned
      description: >
        Planned for P4. ACK is a workflow action on the CONDITION's current ACTIVE state; it
        must never itself clear a condition that is still physically true (revised plan
        section F.2).
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { comment: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }

  /api/v2/elevators/{id}/commands:
    post:
      tags: [Commands]
      operationId: requestElevatorCommand
      x-status: planned
      description: >
        Planned for P5-DRY-RUN. Every REAL-origin elevator is DRY_RUN only, permanently, by
        hardware (the RS485 link is transmit-only) -- LIVE mode is refused for every role,
        unconditionally (test S05, revised plan section 1.3). Result codes for a DRY_RUN
        outcome are SIMULATED_SUCCESS / DRY_RUN_COMPLETED, never EXECUTED (which could be
        misread as hardware having actually moved).
      parameters:
        - { $ref: '#/components/parameters/ElevatorIdPath' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequestCreate' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandRequest' }
        '409':
          description: >
            Returned unconditionally if mode=LIVE is requested for a REAL-origin elevator,
            with Problem.code = COMMAND_NOT_SUPPORTED_READ_ONLY.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v2/analytics/summary:
    get:
      tags: [Analytics]
      operationId: getAnalyticsSummary
      x-status: planned
      description: >
        Planned for P3-HISTORY, per the versioned definitions in revised plan section D.4
        (trip/runtime/idle/floor-visit/coverage). Gaps render as null/censored, never as 0
        or 100% (test U10).
      parameters:
        - name: siteId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsSummary' }

  /api/v2/demo/start:
    post:
      tags: [Demo]
      operationId: startDemo
      x-status: planned
      description: >
        Planned for P4. A per-session overlay, not a global source switch (revision R14 --
        the v1-baseline-era design of a single Redis lms:source flag that would flip the
        whole building's view for every viewer is explicitly rejected). Requires
        supervisor/admin role.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties: { scenario: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoState' }

  /api/v2/demo/stop:
    post:
      tags: [Demo]
      operationId: stopDemo
      x-status: planned
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoState' }

  /api/v2/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v2/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /api/v2/realtime/token:
    post:
      tags: [Realtime]
      operationId: issueRealtimeToken
      description: >
        Issues a short-lived, one-use WebSocket connection ticket. Never a long-lived token
        embedded in a URL query string ([T5] OWASP WebSocket Security Cheat Sheet, cited
        directly in revised plan section C.2).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
                  expiresAt: { type: string, format: date-time }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    ElevatorIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Elevator:
      type: object
      required: [id, elevatorCode, buildingId, liftId, commissioningStatus, serviceStatus]
      properties:
        id: { type: string, format: uuid }
        elevatorCode: { type: string, pattern: '^[A-Z]-[0-9]{2}$' }
        displayName: { type: string }
        buildingId: { type: string, format: uuid }
        liftId: { type: integer, minimum: 1 }
        tags: { type: array, items: { type: string, enum: [REAL, SIMULATED] } }
        commissioningStatus: { type: string, enum: [COMMISSIONED, NOT_COMMISSIONED, DISCOVERED_NOT_COMMISSIONED] }
        serviceStatus: { type: string, enum: [IN_SERVICE, OUT_OF_SERVICE, UNKNOWN] }
        floorProfileId: { type: string }

    ElevatorStatus:
      # Kept structurally aligned with contracts/json-schema/ws/messages.schema.json#elevatorStatus
      # by hand in this round -- no codegen exists yet (open item, G-A decision packet).
      type: object
      required:
        - elevatorId
        - elevatorCode
        - connectionState
        - commissioningStatus
        - serviceStatus
        - monitoringEnabled
        - floorRaw
        - floorDisplay
        - floorKind
        - direction
        - motion
        - operatingMode
        - statusPoints
        - dataQuality
        - origin
      properties:
        elevatorId: { type: string, format: uuid }
        elevatorCode: { type: string }
        connectionState:
          type: string
          enum: [ONLINE, AWAITING_FRESH_PROOF, STALE, INTERFACE_NO_RXTX, GATEWAY_OFFLINE, PENDING_INSTALL, NOT_COMMISSIONED, OUT_OF_SERVICE, UNKNOWN]
        commissioningStatus: { type: string, enum: [COMMISSIONED, NOT_COMMISSIONED, DISCOVERED_NOT_COMMISSIONED] }
        serviceStatus: { type: string, enum: [IN_SERVICE, OUT_OF_SERVICE, UNKNOWN] }
        monitoringEnabled: { type: boolean }
        freshnessSec: { type: [number, 'null'] }
        floorRaw: { type: [string, 'null'] }
        floorDisplay:
          type: [string, 'null']
          description: >
            Backend-computed only. For floorKind UNCALIBRATED/TRANSIT this is a mono
            "code N" string -- never a guessed building label (CONTRACT_BASELINE_DIFF.md
            section 4, test U04).
        floorKind: { type: [string, 'null'], enum: [LANDING, TRANSIT, UNCALIBRATED, null] }
        floorProfileVersion: { type: [string, 'null'] }
        direction: { type: string, enum: [UP, DOWN, IDLE, UNKNOWN] }
        motion: { type: string, enum: [RUNNING, STOPPED, UNKNOWN] }
        operatingMode: { type: string, enum: [NORMAL, FIRE, UNKNOWN] }
        statusPoints: { type: object, additionalProperties: { type: boolean } }
        capabilities: { type: object }
        dataQuality: { type: object }
        activeAlarmCount: { type: integer }
        origin: { type: string, enum: [LIVE, SIMULATED, IMPORT] }
        viewMode: { type: string, enum: [LIVE, TEST, DEMO, HISTORY] }
        sourceObservedAt: { type: [string, 'null'], format: date-time }
        serverReceivedAt: { type: [string, 'null'], format: date-time }
        serverStateRevision: { type: string }

    GatewayStatus:
      type: object
      required: [gatewayId, gatewayCode, connectionState]
      properties:
        gatewayId: { type: string, format: uuid }
        gatewayCode: { type: string }
        connectionState: { type: string, enum: [ONLINE, AWAITING_FRESH_PROOF, OFFLINE, UNKNOWN] }
        lastHeartbeatAt: { type: [string, 'null'], format: date-time }
        agentVersion: { type: [string, 'null'] }

    ElevatorEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventTime: { type: string, format: date-time }
        elevatorId: { type: [string, 'null'], format: uuid }
        eventType: { type: string }
        data: { type: object }

    AlarmSeverity: { type: string, enum: [CRITICAL, MAJOR, MINOR, WARNING] }
    AlarmState: { type: string, enum: [ACTIVE, ACKED, CLEARED, CLOSED] }
    Alarm:
      type: object
      properties:
        id: { type: string, format: uuid }
        elevatorId: { type: string, format: uuid }
        code: { type: string }
        severity: { $ref: '#/components/schemas/AlarmSeverity' }
        state: { $ref: '#/components/schemas/AlarmState' }
        raisedAt: { type: string, format: date-time }

    CommandRequestCreate:
      type: object
      required: [commandType, mode]
      properties:
        commandType: { type: string }
        mode: { type: string, enum: [DRY_RUN, LIVE] }
        reason: { type: string }

    CommandRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        elevatorId: { type: string, format: uuid }
        mode: { type: string, enum: [DRY_RUN, LIVE] }
        state:
          type: string
          enum: [REQUESTED, PENDING_APPROVAL, APPROVED, DISPATCHED, ACCEPTED, EXECUTED, REJECTED, FAILED, TIMED_OUT, CANCELLED]
        resultCode: { type: [string, 'null'], enum: [SIMULATED_SUCCESS, DRY_RUN_COMPLETED, null] }
        notSentToHardware: { type: boolean }

    AnalyticsSummary:
      type: object
      properties:
        tripCount: { type: [integer, 'null'] }
        runtimeMinutes: { type: [number, 'null'] }
        idleMinutes: { type: [number, 'null'] }
        dataCoveragePct: { type: [number, 'null'] }
        definitionVersion: { type: string }

    DemoState:
      type: object
      properties:
        active: { type: boolean }
        scenario: { type: [string, 'null'] }
        startedBy: { type: [string, 'null'] }
        startedAt: { type: [string, 'null'], format: date-time }

    LoginResponse:
      type: object
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [operator, supervisor, technician, admin] }

    Health:
      type: object
      properties:
        status: { type: string, enum: [OK, DEGRADED, DOWN] }
        components: { type: object, additionalProperties: true }
        time: { type: string, format: date-time }

    Problem:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - UNAUTHORIZED
            - FORBIDDEN
            - CONFLICT
            - COMMAND_NOT_SUPPORTED_READ_ONLY
        instance: { type: string }
        correlationId: { type: string }

security:
  - bearerAuth: []
