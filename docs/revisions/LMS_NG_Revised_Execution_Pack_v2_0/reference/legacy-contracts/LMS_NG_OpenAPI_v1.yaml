      - scopeType
      - scopeId
      - schemaVersion
      - configuration
      properties:
        scopeType:
          type: string
        scopeId:
          type: string
          format: uuid
        schemaVersion:
          type: string
        configuration:
          type: object
          additionalProperties: true
    ConfigValidation:
      type: object
