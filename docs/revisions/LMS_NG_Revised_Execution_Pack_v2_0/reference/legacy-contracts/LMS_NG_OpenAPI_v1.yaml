        '400': *id003
        '401': *id004
        '403': *id005
        '404': *id006
        '409': *id007
      security:
      - bearerAuth: []
    post:
      tags:
      - Assets
      summary: Create elevator
      operationId: createElevator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElevatorCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Elevator'
        '400': *id003
        '401': *id004
        '403': *id005
        '404': *id006
        '409': *id007
      security:
      - bearerAuth: []
