openapi: 3.1.0
info:
  title: LMS-NG API
  version: 1.0.0
  description: REST API for Lift Monitoring System Next Generation. Timestamps are ISO-8601 UTC; UI converts to configured
    timezone. Errors use RFC 7807 Problem Details.
servers:
- url: https://lms.example.local
  description: Site server
tags:
- name: Assets
- name: Devices
- name: Monitoring
- name: Alarms
- name: Events
- name: Commands
- name: Maintenance
- name: Analytics
- name: Reports
- name: Configuration
- name: Administration
- name: Integrations
- name: System
paths:
  /api/v1/organizations:
    get:
      tags:
      - Assets
      summary: List organizations
      operationId: listOrganizations
      parameters:
      - &id001
        name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      - &id002
        name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '400': &id003
          $ref: '#/components/responses/BadRequest'
        '401': &id004
          $ref: '#/components/responses/Unauthorized'
        '403': &id005
          $ref: '#/components/responses/Forbidden'
        '404': &id006
          $ref: '#/components/responses/NotFound'
        '409': &id007
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
  /api/v1/sites:
    get:
      tags:
      - Assets
      summary: List/filter sites
      operationId: listSites
      parameters:
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      - *id001
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
        '400': *id003
        '401': *id004
        '403': *id005
        '404': *id006
        '409': *id007
      security:
      - bearerAuth: []
  /api/v1/buildings:
    get:
      tags:
      - Assets
      summary: List/filter buildings
      operationId: listBuildings
      parameters:
      - name: siteId
        in: query
        schema:
          type: string
          format: uuid
      - *id001
      - *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Building'
        '400': *id003
        '401': *id004
        '403': *id005
        '404': *id006
        '409': *id007
      security:
      - bearerAuth: []
  /api/v1/elevator-groups:
